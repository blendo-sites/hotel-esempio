# Controlli del sito: girano su ogni pull request e su main.
# La check da rendere obbligatoria nel ruleset è solo `controlli-ok`.
name: Controlli

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: controlli-${{ github.ref }}
  cancel-in-progress: true

env:
  # Chrome is preinstalled on the runner: Puppeteer must not download its own.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: schema.json aggiornato
        run: |
          npm run schema
          git diff --exit-code -- schema.json || {
            echo "::error file=schema.json::schema.json non corrisponde agli schemi Zod: lancia npm run schema e committa il file."
            exit 1
          }
      - name: Contenuti
        run: npm run check:content
      - name: Test degli script
        run: npm test
      - name: Verifica dei tipi e build
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  accessibilita:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Accessibilità (pa11y-ci, axe, WCAG 2 AA)
        run: npm run check:a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

  link:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Link interni
        run: npm run check:links

  peso:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Peso delle pagine
        run: npm run check:weight

  # The only required check. It runs even when a job before it fails or is
  # skipped: a skipped required check would otherwise count as passed.
  controlli-ok:
    needs: [build, accessibilita, link, peso]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Tutti i controlli sono verdi
        env:
          RISULTATI: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Esiti: $RISULTATI"
          for r in $RISULTATI; do
            if [ "$r" != "success" ]; then
              echo "::error::Almeno un controllo non è passato ($r)."
              exit 1
            fi
          done
